<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SiyamIQ | Graphic Designer & Video Editor</title>
<meta name="description" content="SiyamIQ is the portfolio of Siyam, a Graphic Designer and Video Editor with 5+ years of experience in thumbnails, social media design, photo editing and video editing.">
<meta name="theme-color" content="#07050d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2307050d'/%3E%3Ctext x='50' y='66' font-size='52' font-family='Arial' font-weight='700' text-anchor='middle' fill='%238b3dff'%3EIQ%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07050d;
  --bg2:#0e0a1a;
  --ink:#f6f3ff;
  --muted:#a8a0c4;
  --purple:#8b3dff;
  --neon:#b26bff;
  --line:rgba(255,255,255,.09);
  --glow:0 0 40px rgba(139,61,255,.35);
  --display:"Sora","Segoe UI",Arial,sans-serif;
  --body:"Manrope","Segoe UI",Arial,sans-serif;
  --pad:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.65;min-height:100vh;overflow-x:hidden;padding-top:env(safe-area-inset-top,0px)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--neon);outline-offset:3px;border-radius:6px}
.wrap{width:100%;max-width:1240px;margin:0 auto;padding:0 var(--pad)}
h1,h2,h3{font-family:var(--display);line-height:1.12;letter-spacing:-.02em;font-weight:600}
h1{font-size:clamp(2.3rem,8.4vw,4.6rem)}
h2{font-size:clamp(1.85rem,6vw,3rem)}
h3{font-size:1.3rem}
p{color:var(--muted)}
.lead{font-size:1.15rem;color:var(--muted);max-width:56ch}
section{padding:60px 0}

/* Header */
header.top{position:sticky;top:0;z-index:50;background:rgba(7,5,13,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{font-family:var(--display);font-weight:700;font-size:1.55rem;letter-spacing:-.03em;display:inline-flex;align-items:center}
.logo b{color:var(--neon);font-weight:700}
.logo img{height:46px;width:auto}
.foot .logo img{height:56px}
nav.main{display:none}
.burger{width:52px;height:52px;display:grid;place-items:center;margin-right:-10px}
.burger span,.burger span::before,.burger span::after{display:block;width:26px;height:2px;background:var(--ink);position:relative;border-radius:2px;transition:.2s}
.burger span::before,.burger span::after{content:"";position:absolute;left:0}
.burger span::before{top:-8px}.burger span::after{top:8px}
body.menu-open .burger span{background:transparent}
body.menu-open .burger span::before{top:0;transform:rotate(45deg)}
body.menu-open .burger span::after{top:0;transform:rotate(-45deg)}
.drawer{position:fixed;inset:0;top:calc(68px + env(safe-area-inset-top,0px));background:var(--bg);z-index:49;padding:12px var(--pad) 40px;display:none;overflow-y:auto}
body.menu-open .drawer{display:block}
body.menu-open{overflow:hidden}
.drawer a{display:block;font-family:var(--display);font-size:1.7rem;font-weight:600;padding:18px 0;border-bottom:1px solid var(--line)}
.drawer a.on{color:var(--neon)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 30px;border-radius:999px;font-weight:700;font-size:1.05rem;transition:.2s}
.btn.primary{background:var(--purple);color:#fff;box-shadow:0 0 30px rgba(139,61,255,.45)}
.btn.primary:hover{background:#9b58ff}
.btn.ghost{border:1px solid rgba(255,255,255,.22);color:var(--ink)}
.btn.ghost:hover{border-color:var(--neon);color:var(--neon)}
.actions{display:flex;flex-direction:column;gap:14px}

/* Hero */
.hero{padding:34px 0 40px;position:relative}
.hero-grid{display:grid;gap:26px}
.hero-title{color:var(--neon);font-family:var(--display);font-weight:600;font-size:1.15rem;margin-bottom:14px}
.hero h1{margin-bottom:18px}
.hero p.lead{margin-bottom:28px}
.visual{position:relative;order:-1;max-width:340px;margin:0 auto;width:100%}
.visual svg{width:100%;height:auto;display:block}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:38px;padding-top:26px;border-top:1px solid var(--line)}
.stats strong{display:block;font-family:var(--display);font-size:1.9rem;color:var(--ink);line-height:1.1}
.stats span{font-size:.95rem;color:var(--muted);display:block;margin-top:6px;line-height:1.35}

/* Service rows */
.sec-head{margin-bottom:30px}
.sec-head p{margin-top:12px}
.svc-cols{display:grid;gap:44px}
.svc-col h3{font-size:1.7rem;margin-bottom:6px}
.svc-col>p{margin-bottom:14px}
.rows{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 0;border-bottom:1px solid var(--line);min-height:72px;transition:.2s}
.row:hover{padding-left:8px;border-color:var(--purple)}
.row strong{font-family:var(--display);font-weight:600;font-size:1.15rem;display:block;color:var(--ink)}
.row small{display:block;font-size:1rem;color:var(--muted);margin-top:2px;line-height:1.45}
.row svg{flex:none;width:22px;height:22px;stroke:var(--neon)}
.more{display:inline-flex;margin-top:22px;color:var(--neon);font-weight:700;padding:8px 0}

/* Carousels */
.carousel{position:relative}
.car-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.car-nav{display:none;gap:10px}
.car-btn{width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.2);display:grid;place-items:center;flex:none;transition:.2s}
.car-btn:hover{border-color:var(--neon);color:var(--neon)}
.car-btn svg{width:20px;height:20px;stroke:currentColor}
.car-track{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:4px 2px 18px;margin:0 calc(var(--pad) * -1);padding-left:var(--pad);padding-right:var(--pad)}
.car-track::-webkit-scrollbar{display:none}
.car-card{flex:0 0 82%;scroll-snap-align:start;background:var(--bg2);border:1px solid var(--line);border-radius:24px;padding:28px;display:flex;flex-direction:column;justify-content:space-between;min-height:200px;transition:.2s}
.car-card:hover,.car-card:focus-visible{border-color:var(--purple);box-shadow:0 0 26px rgba(139,61,255,.22)}
.car-card h3{margin-bottom:10px}
.car-card p{font-size:1rem;margin-bottom:20px}
.car-card .go{display:inline-flex;align-items:center;gap:8px;color:var(--neon);font-weight:700}
.car-card .go svg{width:18px;height:18px;stroke:currentColor}
.cat-card{min-height:230px}
.cat-card .count{display:inline-block;font-size:.9rem;color:var(--muted);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:5px 14px;margin-bottom:14px;align-self:flex-start}
@media (min-width:900px){
  .car-nav{display:flex}
  .car-track{margin:0;padding:4px 4px 18px}
  .car-card{flex:0 0 300px}
  .cat-card{flex:0 0 380px}
}

/* Page head */
.page-head{padding:44px 0 8px}
.crumbs{font-size:1rem;color:var(--muted);margin-bottom:18px;display:flex;flex-wrap:wrap;gap:8px}
.crumbs a{color:var(--neon)}
.page-head h1{font-size:clamp(2.1rem,7vw,3.8rem);margin-bottom:16px}

/* Detail */
.detail{display:grid;gap:36px;padding-top:26px}
.detail h2{font-size:1.5rem;margin-bottom:14px}
.list{list-style:none;border-top:1px solid var(--line)}
.list li{padding:15px 0 15px 30px;border-bottom:1px solid var(--line);position:relative;color:var(--ink)}
.list li::before{content:"";position:absolute;left:0;top:23px;width:12px;height:12px;border-radius:50%;background:var(--purple);box-shadow:0 0 12px var(--purple)}
.cta-band{margin-top:14px;padding:34px 26px;border-radius:26px;background:linear-gradient(135deg,rgba(139,61,255,.22),rgba(139,61,255,.05));border:1px solid rgba(178,107,255,.28)}
.cta-band h2{margin-bottom:10px}
.cta-band p{margin-bottom:22px}

/* Portfolio */
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 30px}
.chip{min-height:48px;display:inline-flex;align-items:center;padding:0 22px;border-radius:999px;border:1px solid rgba(255,255,255,.18);font-weight:600;color:var(--muted)}
.chip.on{background:var(--purple);border-color:var(--purple);color:#fff}
.grid{display:grid;gap:26px}
.proj .thumb{aspect-ratio:16/10;border-radius:20px;overflow:hidden;background:linear-gradient(135deg,#1a0f33,#0e0a1a);border:1px solid var(--line);position:relative}
.proj .thumb img{width:100%;height:100%;object-fit:cover}
.price-badge{position:absolute;right:12px;bottom:12px;background:rgba(7,5,13,.82);backdrop-filter:blur(6px);border:1px solid rgba(178,107,255,.5);color:#fff;font-family:var(--display);font-weight:600;font-size:.95rem;padding:6px 14px;border-radius:999px}
.proj h3{margin:14px 0 4px}
.proj p{font-size:1rem}
.tag{display:inline-block;font-size:.95rem;color:var(--neon);font-weight:600}
.empty{padding:38px 26px;border:1px dashed rgba(178,107,255,.4);border-radius:26px;background:rgba(139,61,255,.05)}
.empty h3{font-size:1.5rem;margin-bottom:10px}
.empty p{margin-bottom:22px;max-width:52ch}
.ba{display:grid;gap:16px}
.ba figure figcaption{margin-top:8px;color:var(--muted);font-size:1rem}
.ba img{border-radius:16px;width:100%}

/* Process */
.steps{border-top:1px solid var(--line);counter-reset:s}
.step{display:grid;grid-template-columns:52px 1fr;gap:16px;padding:26px 0;border-bottom:1px solid var(--line)}
.step .n{font-family:var(--display);font-weight:700;font-size:1.5rem;color:var(--neon)}
.step h3{margin-bottom:6px}

/* About */
.about-grid{display:grid;gap:36px}
.skills{display:grid;gap:34px}
.skills h3{margin-bottom:12px}

/* Contact */
.contact-grid{display:grid;gap:40px}
.channels{border-top:1px solid var(--line)}
.channels a{display:block;padding:20px 0;border-bottom:1px solid var(--line);min-height:72px}
.channels small{display:block;color:var(--muted);font-size:1rem}
.channels strong{font-family:var(--display);font-size:1.2rem;font-weight:600;word-break:break-word}
.channels a:hover strong{color:var(--neon)}
form{display:grid;gap:18px}
label{display:grid;gap:8px;font-weight:600;font-size:1.02rem}
input,select,textarea{width:100%;font:inherit;font-size:1.05rem;color:var(--ink);background:var(--bg2);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:16px;min-height:56px}
textarea{min-height:150px;resize:vertical}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--neon) 50%),linear-gradient(135deg,var(--neon) 50%,transparent 50%);background-position:calc(100% - 22px) 26px,calc(100% - 16px) 26px;background-size:6px 6px;background-repeat:no-repeat}
input:focus,select:focus,textarea:focus{border-color:var(--neon);outline:none;box-shadow:0 0 0 3px rgba(139,61,255,.25)}
.note{font-size:1rem;color:var(--muted)}

/* Footer */
footer{border-top:1px solid var(--line);padding:48px 0 34px;margin-top:30px;background:var(--bg2)}
.foot{display:grid;gap:32px}
.foot h4{font-family:var(--display);font-size:1.05rem;margin-bottom:12px}
.foot a{display:block;padding:7px 0;color:var(--muted)}
.foot a:hover{color:var(--neon)}
.copy{margin-top:34px;padding-top:22px;border-top:1px solid var(--line);font-size:1rem;color:var(--muted)}

/* Intro (the only animation) */
#intro{position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at 50% 42%,#26104d 0%,#07050d 62%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .6s,visibility .6s}
#intro.gone{opacity:0;visibility:hidden}
#intro .i-logo{font-family:var(--display);font-weight:700;font-size:clamp(3rem,15vw,7rem);letter-spacing:-.04em;line-height:1;animation:reveal 1.3s cubic-bezier(.2,.7,.2,1) both,glow 3s ease-in-out 1.3s infinite}
#intro .i-logo b{color:var(--neon)}
#intro .i-logo img{height:auto;width:min(84vw,620px);margin:0 auto;filter:drop-shadow(0 0 34px rgba(139,61,255,.55))}
#intro .i-name{font-family:var(--display);font-size:clamp(1.4rem,5vw,2rem);margin-top:22px;animation:rise .9s ease .9s both}
#intro .i-role{color:var(--muted);font-size:1.15rem;margin-top:6px;animation:rise .9s ease 1.2s both}
#intro .btn{margin-top:38px;animation:rise .9s ease 1.7s both}
@keyframes reveal{from{opacity:0;letter-spacing:.25em;filter:blur(12px)}to{opacity:1;letter-spacing:-.04em;filter:blur(0)}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{text-shadow:0 0 30px rgba(139,61,255,.35)}50%{text-shadow:0 0 60px rgba(139,61,255,.75)}}
@media (prefers-reduced-motion:reduce){#intro *{animation:none!important}html{scroll-behavior:auto}.row{transition:none}}

/* Desktop (designed separately) */
@media (min-width:900px){
  :root{--pad:48px}
  body{font-size:18px}
  section{padding:88px 0}
  .bar{height:82px}
  .drawer{top:calc(82px + env(safe-area-inset-top,0px))}
  .burger{display:none}
  .logo{font-size:1.75rem}
  .logo img{height:54px}
  nav.main{display:flex;gap:6px}
  nav.main a{padding:10px 16px;border-radius:999px;font-weight:600;font-size:1rem;color:var(--muted);transition:.2s}
  nav.main a:hover{color:var(--ink)}
  nav.main a.on{color:#fff;background:rgba(139,61,255,.28)}
  .actions{flex-direction:row}
  .hero{padding:56px 0 64px}
  .hero-grid{grid-template-columns:1.1fr .9fr;align-items:center;gap:40px}
  .visual{order:0;max-width:560px;margin:0 0 0 auto}
  .hero-title{font-size:1.3rem}
  .stats strong{font-size:2.6rem}
  .svc-cols{grid-template-columns:1fr 1fr;gap:72px}
  .page-head{padding:64px 0 12px}
  .detail{grid-template-columns:1.2fr .8fr;gap:64px}
  .detail .side{position:sticky;top:110px;align-self:start}
  .grid{grid-template-columns:repeat(3,1fr)}
  .ba{grid-template-columns:1fr 1fr}
  .step{grid-template-columns:90px 1fr;padding:34px 0}
  .step .n{font-size:2rem}
  .about-grid{grid-template-columns:1fr 1fr;gap:72px}
  .skills{grid-template-columns:1fr 1fr;gap:56px}
  .contact-grid{grid-template-columns:.85fr 1.15fr;gap:80px}
  .foot{grid-template-columns:1.4fr 1fr 1fr;gap:56px}
  .cta-band{padding:52px}
  .empty{padding:56px}
}
</style>
</head>

<script>
/* ============================================================
   EASY EDIT AREA
   ============================================================ */
var LOGO_SRC = "data:image/png;base64,PLACEHOLDER";   // kept below, unchanged
var WA_NUMBER = "8801856101271";
var EMAIL = "siyammicrowork@gmail.com";
var FIVERR = "https://www.fiverr.com/siyamiq";

/* Projects and reviews are now managed from the admin panel (/admin) and
   loaded at runtime from content/projects.json and content/reviews.json.
   These stay empty here as a fallback in case those files are missing. */
var PROJECTS = [];
var REVIEWS = [];

function slugify(s){
  return String(s||"").toLowerCase().trim()
    .replace(/[^a-z0-9]+/g,"-").replace(/(^-+|-+$)/g,"") || "project";
}

function loadContent(){
  var seen = {};
  fetch("content/services.json", {cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(d){
    if(!d || !d.categories || !d.categories.length) return;
    var obj = {};
    d.categories.forEach(function(c){
      obj[c.key] = { name:c.name, blurb:c.blurb, items:(c.items||[]).map(function(it){
        return {
          slug: it.slug || slugify(it.name),
          name: it.name,
          short: it.short,
          desc: it.desc,
          includes: (it.includes||"").split("\n").map(function(s){return s.trim()}).filter(Boolean),
          goodFor: it.goodFor,
          portfolio: it.portfolio || "graphic-design"
        };
      })};
    });
    SERVICES = obj;
    route();
  }).catch(function(){});
  fetch("content/projects.json", {cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(d){
    if(!d || !d.items) return;
    PROJECTS = d.items.map(function(p){
      var base = slugify(p.title), id = base;
      var n = 2; while(seen[id]){ id = base+"-"+n; n++; }
      seen[id] = true;
      p.id = id;
      return p;
    });
    route();
  }).catch(function(){});
  fetch("content/reviews.json", {cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(d){
    if(!d || !d.items) return;
    REVIEWS = d.items;
    route();
  }).catch(function(){});

/* ---------- router ---------- */
function route(){
  var parts = (location.hash||"#/home").replace(/^#\/?/,"").split("/").filter(Boolean);
  var top = parts[0] || "home";
  var html;
  if(top==="home") html = VIEWS.home();
  else if(top==="about") html = VIEWS.about();
  else if(top==="services"){
    if(parts.length===1) html = VIEWS.services();
    else if(parts.length===2) html = VIEWS.category(parts[1]);
    else html = VIEWS.service(parts[1], parts[2]);
  }
  else if(top==="portfolio"){
    if(parts[1]==="project") html = VIEWS.project(parts[2]);
    else html = VIEWS.portfolio(parts[1]);
  }
  else if(top==="process") html = VIEWS.process();
  else if(top==="reviews") html = VIEWS.reviews();
  else if(top==="contact") html = VIEWS.contact();
  else html = VIEWS.notfound();
  document.getElementById("app").innerHTML = html;
  bindPage();
  markNav(top);
  closeMenu();
  window.scrollTo(0,0);
  var t = {home:"",about:"About | ",services:"Services | ",portfolio:"Portfolio | ",process:"Process | ",reviews:"Reviews | ",contact:"Contact | "}[top];
  document.title = (t||"") + "SiyamIQ | Graphic Designer & Video Editor";
  pendingService = "";
}

function markNav(top){
  var links = document.querySelectorAll("#navMain a, #drawer a");
  for(var i=0;i<links.length;i++){
    links[i].classList.toggle("on", links[i].getAttribute("data-k")===top);
  }
}

function bindPage(){
  var navBtns = document.querySelectorAll(".car-btn");
  for(var j=0;j<navBtns.length;j++){
    navBtns[j].addEventListener("click", function(){
      var track = document.getElementById(this.getAttribute("data-car"));
      if(!track) return;
      var dir = parseInt(this.getAttribute("data-dir"),10);
      var card = track.querySelector(".car-card");
      var step = card ? (card.getBoundingClientRect().width + 16) : track.clientWidth*0.9;
      track.scrollBy({left: dir*step, behavior:"smooth"});
    });
  }
  var svc = document.querySelectorAll("[data-service]");
  for(var i=0;i<svc.length;i++){
    svc[i].addEventListener("click", function(){ pendingService = this.getAttribute("data-service"); });
  }
  var form = document.getElementById("contactForm");
  if(form){
    form.addEventListener("submit", function(e){
      e.preventDefault();
      var f = form.elements;
      var note = document.getElementById("formNote");
      if(!f.name.value.trim() || !f.email.value.trim() || !f.message.value.trim()){
        note.textContent = "Please fill in your name, email and message.";
        note.style.color = "#ff9bd0";
        return;
      }
      var subject = "Project enquiry" + (f.service.value ? ": " + f.service.value : "");
      var body = "Name: "+f.name.value.trim()+"\nEmail: "+f.email.value.trim()+"\nService: "+(f.service.value||"Not selected")+"\n\n"+f.message.value.trim();
      note.style.color = "";
      note.textContent = "Opening your email app...";
      location.href = "mailto:"+EMAIL+"?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body);
    });
  }
  var rf = document.getElementById("reviewForm");
  if(rf){
    rf.addEventListener("submit", function(e){
      e.preventDefault();
      var f = rf.elements;
      var note = document.getElementById("reviewNote");
      if(!f.name.value.trim() || !f.message.value.trim()){
        note.textContent = "Please add your name and a short review.";
        note.style.color = "#ff9bd0";
        return;
      }
      var data = {
        "form-name": "reviews",
        name: f.name.value.trim(),
        company: f.company.value.trim(),
        role: f.role.value.trim(),
        message: f.message.value.trim(),
        "bot-field": f["bot-field"] ? f["bot-field"].value : ""
      };
      var encoded = Object.keys(data).map(function(k){return encodeURIComponent(k)+"="+encodeURIComponent(data[k])}).join("&");
      note.style.color = "";
      note.textContent = "Sending...";
      fetch("/", {method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"}, body: encoded})
        .then(function(){ note.style.color = "#b26bff"; note.textContent = "Thank you! Your review has been sent for approval."; rf.reset(); })
        .catch(function(){ note.style.color = "#ff9bd0"; note.textContent = "Something went wrong. Please try WhatsApp or Email instead."; });
    });
  }
}

function closeMenu(){
  document.body.classList.remove("menu-open");
  var b = document.getElementById("burger");
  b.setAttribute("aria-expanded","false");
  b.setAttribute("aria-label","Open menu");
}
document.getElementById("burger").addEventListener("click", function(){
  var open = document.body.classList.toggle("menu-open");
  this.setAttribute("aria-expanded", open?"true":"false");
  this.setAttribute("aria-label", open?"Close menu":"Open menu");
});

/* ---------- build shell ---------- */
(function init(){
  var linksHtml = NAV.map(function(n){return '<a href="#/'+n[0]+'" data-k="'+n[0]+'">'+n[1]+'</a>'}).join("");
  document.getElementById("navMain").innerHTML = linksHtml;
  document.getElementById("drawer").innerHTML = linksHtml;
  document.getElementById("footNav").innerHTML = NAV.map(function(n){return '<a href="#/'+n[0]+'">'+n[1]+'</a>'}).join("");
  document.getElementById("headLogo").innerHTML = '<span class="logo">'+logoHTML()+'</span>';
  document.getElementById("footLogo").innerHTML = logoHTML();
  document.getElementById("introLogo").innerHTML = logoHTML();
  document.getElementById("yr").textContent = new Date().getFullYear();
  var was = document.querySelectorAll("[data-wa]");
  for(var i=0;i<was.length;i++){ was[i].href = waLink("Hi Siyam, I would like to talk about a project."); }

  var intro = document.getElementById("intro");
  var seen = false;
  try{ seen = sessionStorage.getItem("siyamiq_intro")==="1"; }catch(e){}
  if(seen){ intro.classList.add("gone"); }
  document.getElementById("enterBtn").addEventListener("click", function(){
    try{ sessionStorage.setItem("siyamiq_intro","1"); }catch(e){}
    intro.classList.add("gone");
    if(!location.hash) location.hash = "#/home";
    window.scrollTo(0,0);
  });

  window.addEventListener("hashchange", route);
  route();
  loadContent();
})();
</script>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script>
if (window.netlifyIdentity) {
  window.netlifyIdentity.on("init", function(user){
    if(!user){
      window.netlifyIdentity.on("login", function(){
        document.location.href = "/admin/";
      });
    }
  });
}
</script>
